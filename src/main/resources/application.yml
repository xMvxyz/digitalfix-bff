server:
  port: 8080

spring:
  application:
    name: digitalfix-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0}
          jwk-set-uri: ${JWT_JWK_SET_URI:}
          audiences: ${JWT_AUDIENCE:api://digitalfix-bff}

app:
  workorders-url: ${WORKORDERS_URL:http://localhost:8081}
  catalog-url: ${CATALOG_URL:http://localhost:8082}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100}
  # Para desarrollo local sin Entra ID, poner true y el BFF no exigira JWT (solo para demo)
  security-disabled: ${SECURITY_DISABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: digitalfix-bff
    version: 0.0.1-SNAPSHOT

---
spring:
  config:
    activate:
      on-profile: test
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:0
app:
  security-disabled: true
